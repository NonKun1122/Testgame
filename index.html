<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>เกมคลิกที่สวยงาม</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .game-container {
            background: rgba(255, 255, 255, 0.8);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            text-align: center;
            width: 300px;
            max-width: 90%;
        }

        h1 {
            color: #2575fc;
            margin-bottom: 20px;
        }

        #score {
            font-size: 48px;
            color: #2575fc;
            margin: 20px 0;
        }

        #clicker {
            padding: 15px 30px;
            font-size: 18px;
            background: #2575fc;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        #clicker:hover {
            background: #1a5a9e;
            transform: scale(1.1);
        }

        #clicker:active {
            transform: scale(0.9);
        }

        #upgrade {
            margin-top: 20px;
            display: none;
        }

        #upgrade button {
            margin-top: 10px;
            padding: 10px 20px;
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #upgrade button:hover {
            background: #e63946;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>เกมคลิกที่สวยงาม</h1>
        <div id="score">คะแนน: 0</div>
        <button id="clicker">คลิกที่นี่เพื่อเพิ่มคะแนน!</button>
        <div id="upgrade">
            <h2>อัปเกรดความเร็ว</h2>
            <p>ค่าใช้จ่าย: 100 คะแนน</p>
            <button onclick="buyUpgrade()">ซื้ออัปเกรด</button>
        </div>
    </div>

    <script>
        let score = 0;
        let clickValue = 1;
        let upgradeBought = false;

        document.getElementById('clicker').addEventListener('click', () => {
            score += clickValue;
            updateScore();
        });

        function updateScore() {
            document.getElementById('score').textContent = `คะแนน: ${score}`;
            const upgrade = document.getElementById('upgrade');
            if (score >= 100 && !upgradeBought) {
                upgrade.style.display = 'block';
            }
        }

        function buyUpgrade() {
            if (score >= 100) {
                score -= 100;
                clickValue *= 2;
                upgradeBought = true;
                document.getElementById('upgrade').style.display = 'none';
                updateScore();
            }
        }
    </script>
</body>
</html>
